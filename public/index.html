<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Webex Playtime Signup"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Webex Playtime Signup - Variant 1</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#005073",
                        "primary-dark": "#003a54",
                        "primary-light": "#007aa3",
                        "secondary": "#00bceb",
                        "completed": "#067a6f",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "6px",
                        "lg": "12px",
                        "xl": "16px",
                        "2xl": "20px",
                        "full": "9999px"
                    },
                    boxShadow: {
                        "soft": "0 4px 12px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)",
                        "premium": "0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .certification-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .certification-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .certificate-seal {
            background: linear-gradient(135deg, #005073 0%, #00bceb 100%);
        }
        .spider-chart-bg {
            background-image: radial-gradient(circle at center, transparent 30%, rgba(0, 80, 115, 0.05) 31%, rgba(0, 80, 115, 0.05) 32%, transparent 33%),
                              radial-gradient(circle at center, transparent 50%, rgba(0, 80, 115, 0.05) 51%, rgba(0, 80, 115, 0.05) 52%, transparent 53%),
                              radial-gradient(circle at center, transparent 70%, rgba(0, 80, 115, 0.05) 71%, rgba(0, 80, 115, 0.05) 72%, transparent 73%);
        }
        .module-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.08);
        }
        .glass-pending {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border: 1px dashed #cbd5e1;
        }
        .dark .glass-pending {
            background: rgba(30, 41, 59, 0.4);
            border-color: #334155;
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .org-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .org-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.1);
        }
        .connector-h {
            height: 2px;
            background: #e2e8f0;
            flex-grow: 1;
        }
        .connector-v {
            width: 2px;
            background: #e2e8f0;
            height: 24px;
            margin: 0 auto;
        }
        .dark .connector-h {
            background: #334155;
        }
        .dark .connector-v {
            background: #334155;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
        }
        .video-overlay {
            background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 50%);
        }
    </style>
  </head>
